name: Apply PR 213 terminal-state correction

on:
  pull_request:
    types: [synchronize]
  push:
    branches: [health-db-relocation]

permissions:
  contents: read

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: health-db-relocation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Apply terminal-state correction
        run: |
          node .github/agent-fixes/apply-pr213-terminal-state.mjs
          node .github/agent-fixes/fix-pr213-lock-release.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Run relocation tests
        shell: bash
        run: |
          set -o pipefail
          npx vitest run test/healthDbRelocation.test.ts 2>&1 | tee pr213-terminal-state-tests.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr213-terminal-state-tests-${{ github.sha }}
          if-no-files-found: warn
          path: pr213-terminal-state-tests.log

      - name: Typecheck
        run: npm run typecheck

      - name: Validate diff
        run: git diff --check

      - name: Upload validated correction
        uses: actions/upload-artifact@v4
        with:
          name: pr213-validated-terminal-state-${{ github.sha }}
          if-no-files-found: error
          path: |
            scripts/relocate-health-db.ts
            test/healthDbRelocation.test.ts
