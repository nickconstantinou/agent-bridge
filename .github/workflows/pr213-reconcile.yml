`, { mode: 0o755 });

'''
          if setup_anchor not in text:
              raise SystemExit("test setup anchor missing")
          text = text.replace(setup_anchor, setup + setup_anchor, 1)

          closing = '\n});\n'
          if not text.endswith(closing):
              raise SystemExit("unexpected test file ending")
          additions = r'''

  it("creates a 0700 runtime-owned destination and probes WAL/SHM access while the service is initially inactive", async () => {
    seedDb(resolvedOldPath);
    const runuserLog = join(testRoot, ".runuser-probe");
    writeFileSync(join(testRoot, "bin/runuser"), `#!/bin/sh
echo "$*" > "${runuserLog}"
while [ "$#" -gt 0 ] && [ "$1" != "--" ]; do shift; done
[ "$1" = "--" ] && shift
exec "$@"
`, { mode: 0o755 });

    await relocateHealthDb({ oldPath, newPath, envFilePath, rolloutConfigPath, serviceName, runtimeUser: "runtime-test-user", expectedInstallationId: "test-install-id-123" });

    const stat = (await import("node:fs")).statSync(dirname(resolvedNewPath));
    expect(stat.mode & 0o777).toBe(0o700);
    expect(readFileSync(runuserLog, "utf8")).toContain("runtime-test-user");
    expect(existsSync(resolvedNewPath)).toBe(true);
  });

  it("fails closed on an existing destination directory with incorrect mode", async () => {
    seedDb(resolvedOldPath);
    mkdirSync(dirname(resolvedNewPath), { recursive: true, mode: 0o755 });
    await expect(relocateHealthDb({ oldPath, newPath, envFilePath, rolloutConfigPath, serviceName, expectedInstallationId: "test-install-id-123" }))
      .rejects.toThrow(/Destination directory .* mode .*expected 0700/);
    expect(existsSync(resolvedOldPath)).toBe(true);
    expect(existsSync(resolvedNewPath)).toBe(false);
  });

  it("rolls back when the runtime-user database access probe fails", async () => {
    seedDb(resolvedOldPath);
    writeFileSync(join(testRoot, "bin/runuser"), "#!/bin/sh\nexit 9\n", { mode: 0o755 });
    await expect(relocateHealthDb({ oldPath, newPath, envFilePath, rolloutConfigPath, serviceName, runtimeUser: "runtime-test-user", expectedInstallationId: "test-install-id-123" }))
      .rejects.toThrow(/Runtime-user database access probe failed/);
    expect(existsSync(resolvedOldPath)).toBe(true);
    expect(existsSync(resolvedNewPath)).toBe(false);
  });

  it.each([
    ["commented-only environment assignment", (env: string, rollout: string) => [env.replace(/^HEALTH_DB_PATH=.*$/m, `# HEALTH_DB_PATH=${newPath}`), rollout]],
    ["duplicate environment assignment", (env: string, rollout: string) => [`${env}\nHEALTH_DB_PATH=${newPath}\n`, rollout]],
    ["mixed old and new rollout inventory", (env: string, rollout: string) => [env, `${rollout}\ndatabase=${oldPath}\n`]],
    ["malformed environment assignment", (env: string, rollout: string) => [env.replace(/^HEALTH_DB_PATH=.*$/m, "HEALTH_DB_PATH malformed"), rollout]],
  ])("fails closed when a completion record sees %s", async (_label, mutate) => {
    seedDb(resolvedOldPath);
    await relocateHealthDb({ oldPath, newPath, envFilePath, rolloutConfigPath, serviceName, expectedInstallationId: "test-install-id-123" });
    const [env, rollout] = mutate(readFileSync(resolvedEnvFilePath, "utf8"), readFileSync(resolvedRolloutConfigPath, "utf8"));
    writeFileSync(resolvedEnvFilePath, env);
    writeFileSync(resolvedRolloutConfigPath, rollout);
    await expect(relocateHealthDb({ oldPath, newPath, envFilePath, rolloutConfigPath, serviceName, expectedInstallationId: "test-install-id-123" }))
      .rejects.toThrow(/declares relocation-success but live database\/configuration state does not match/);
    expect(existsSync(resolvedNewPath)).toBe(true);
  });
'''
          tests.write_text(text[:-len(closing)] + additions + closing)
